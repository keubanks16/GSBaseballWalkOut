<body>
<header>
  <div class="logo">GS</div>
  <div class="t"><b>Walkout Songs</b><small id="teamName"></small></div>
</header>

<main>
  <section class="view on" id="v-game"></section>
  <section class="view" id="v-roster"></section>
  <section class="view" id="v-sounds"></section>
  <section class="view" id="v-settings"></section>
</main>

<div id="np">
  <div class="i"><b id="np-name"></b><small id="np-song"></small><div class="bar"><i id="np-prog"></i></div></div>
  <button onclick="fadeNow()">Fade</button>
  <button onclick="stopAll()" aria-label="Stop">■</button>
</div>

<nav>
  <button class="on" data-v="game"><span>⚾</span>Game</button>
  <button data-v="roster"><span>👥</span>Roster</button>

  <button data-v="settings"><span>⚙️</span>Settings</button>
</nav>

<div id="sheet"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const fmt = s => { s = Math.max(0, +s || 0); const m = Math.floor(s / 60), r = Math.round((s - m * 60) * 10) / 10; return m + ':' + (r < 10 ? '0' : '') + r; };
const once = fn => { let d = false; return (...a) => { if (!d) { d = true; fn && fn(...a); } }; };
function toast(msg, ms = 2200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

/* ============ storage (IndexedDB) ============ */
let _db;
function openDB() {
  return _db ||= new Promise((res, rej) => {
    const r = indexedDB.open('gs-walkout', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('audio'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idb(store, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const kvGet = k => idb('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv', 'readwrite', s => s.put(v, k));
const audioGet = k => idb('audio', 'readonly', s => s.get(k));
const audioSet = (k, v) => idb('audio', 'readwrite', s => s.put(v, k));
const audioDel = k => k ? idb('audio', 'readwrite', s => s.delete(k)) : Promise.resolve();
const audioKeys = () => idb('audio', 'readonly', s => s.getAllKeys());
const audioClear = () => idb('audio', 'readwrite', s => s.clear());

/* ============ data ============ */
let data;
const newTeam = name => ({ id: uid(), name, players: [], lineup: [], upNext: 0 });
function defaultData() {
  const t = newTeam('Georgia Stingerz');
  return { v: 1, teams: [t], teamId: t.id, settings: { voice: '', rate: 0.9, pitch: 1, template: 'Now batting... number {number}... {name}!', length: 15, fadeOut: 2, duck: 0.25, sfx: [], speaker: 'zeus', pa: 'stadium', depth: 1, server: '', engine: 'pro', elVoice: 'nPczCjzI2devNBz1zQrb', elCustom: '', style: 'hype' } };
}
const team = () => data.teams.find(t => t.id === data.teamId) || data.teams[0];
const S = () => data.settings;
let saveTimer;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => kvSet('data', data).catch(e => toast('Save failed: ' + e.message)), 150); }
function newPlayer() { const s = S(); return { id: uid(), name: '', number: '', position: '', songId: null, songName: '', start: 0, length: s.length, fadeOut: s.fadeOut, vol: 100, announce: 'pro', text: '', voiceId: null, proId: null, proKey: '', echo: true, under: false }; }
function findPlayer(id) { for (const t of data.teams) { const p = t.players.find(x => x.id === id); if (p) return p; } return null; }
function cleanLineup(t) { t.lineup = t.lineup.filter(id => t.players.some(p => p.id === id)); if (t.upNext >= t.lineup.length) t.upNext = 0; }

/* ============ audio engine ============ */
let ctx, master;
function setSession(type) { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {} }
function ac() {
  if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; ctx = new C(); master = ctx.createGain(); master.connect(ctx.destination); }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
const decodeRaw = ab => new Promise((res, rej) => ac().decodeAudioData(ab.slice(0), res, rej));
async function loadRaw(id) { const r = id && await audioGet(id); return r ? r.data : null; }
const bufCache = new Map(), clipCache = new Map();
function getBuf(id) {
  if (!id) return Promise.resolve(null);
  if (!bufCache.has(id)) { const pr = loadRaw(id).then(d => d && decodeRaw(d)); bufCache.set(id, pr); pr.catch(() => bufCache.delete(id)); }
  return bufCache.get(id);
}
function sliceBuf(b, st, dur) {
  const sr = b.sampleRate, s = Math.min(Math.floor(st * sr), Math.max(0, b.length - sr)), e = Math.min(b.length, s + Math.floor(dur * sr)), n = Math.max(1, e - s);
  const out = ctx.createBuffer(b.numberOfChannels, n, sr);
  for (let c = 0; c < b.numberOfChannels; c++) out.copyToChannel(b.getChannelData(c).subarray(s, s + n), c);
  return out;
}
// Only keep the part of the song we actually play (saves phone memory)
function getClip(p) {
  const st = +p.start || 0, len = +p.length || 0, span = len > 0 ? len + 20 : 360;
  if (p._song) return decodeRaw(p._song.data).then(b => sliceBuf(b, st, span));
  if (!p.songId) return Promise.resolve(null);
  const key = p.songId + '|' + st + '|' + len;
  if (!clipCache.has(key)) {
    const pr = loadRaw(p.songId).then(d => d && decodeRaw(d)).then(b => b && sliceBuf(b, st, span));
    clipCache.set(key, pr); pr.catch(() => clipCache.delete(key));
    while (clipCache.size > 24) clipCache.delete(clipCache.keys().next().value);
  }
  return clipCache.get(key);
}
function getVoice(p) { return p._voice ? decodeRaw(p._voice.data) : getBuf(p.voiceId); }
function forgetAudio(id) { if (!id) return; bufCache.delete(id); for (const k of [...clipCache.keys()]) if (k.startsWith(id + '|')) clipCache.delete(k); }

let cur = null, np = null, voiceSrc = null, playToken = 0, raf;

function findVoice(name) { try { return speechSynthesis.getVoices().find(v => v.name === name) || null; } catch (e) { return null; } }
function announceText(p) {
  if (p.text && p.text.trim()) return p.text.trim();
  let t = S().template || '{name}';
  if (!String(p.number ?? '').trim()) t = t.replace(/number\s*\{number\}[\s,.…]*/i, '').replace(/\{number\}[\s,.…]*/g, '');
  const first = (p.name || '').split(' ')[0];
  return t.replace(/\{number\}/g, p.number).replace(/\{name\}/g, p.name).replace(/\{first\}/g, first).replace(/\{position\}/g, p.position || '').replace(/\{team\}/g, (data && team().name) || '');
}
function speak(text, done) {
  done = once(done);
  if (!('speechSynthesis' in window) || !text) return done();
  const u = new SpeechSynthesisUtterance(text);
  const v = findVoice(S().voice); if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = +S().rate || 0.9; u.pitch = +S().pitch || 1; u.volume = 1;
  u.onend = () => done(); u.onerror = () => done();
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  setTimeout(done, 2500 + text.length * 110 / u.rate); // safety net if the browser never fires onend
}
/* ---- stadium P.A. sound: EQ + compression + speaker slap-back + big-park reverb ---- */
const IR = {};
function impulse(sec, decay) {
  const k = sec + '|' + decay; if (IR[k]) return IR[k];
  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
  return IR[k] = b;
}
function paChain(level, dur) {
  const nodes = [], mk = n => (nodes.push(n), n), input = mk(ctx.createGain());
  setTimeout(() => nodes.forEach(n => { try { n.disconnect(); } catch (e) {} }), (dur + 6) * 1000);
  if (!level || level === 'off') { input.connect(master); return input; }
  const big = level === 'stadium';
  const f = (type, freq, gain, q) => { const b = mk(ctx.createBiquadFilter()); b.type = type; b.frequency.value = freq; if (gain != null) b.gain.value = gain; if (q) b.Q.value = q; return b; };
  const hp = f('highpass', 110), boom = f('lowshelf', 190, 3.5), pres = f('peaking', 2800, 5, .9), lp = f('lowpass', big ? 7200 : 9000);
  const comp = mk(ctx.createDynamicsCompressor()); comp.threshold.value = -28; comp.knee.value = 6; comp.ratio.value = 8; comp.attack.value = .003; comp.release.value = .2;
  const out = mk(ctx.createGain()); out.gain.value = 1.45;
  input.connect(hp); hp.connect(boom); boom.connect(pres); pres.connect(lp); lp.connect(comp); comp.connect(out); out.connect(master);
  (big ? [[.13, .26], [.29, .16], [.47, .08]] : [[.09, .16], [.2, .07]]).forEach(([t, g]) => { const d = mk(ctx.createDelay(1)), a = mk(ctx.createGain()); d.delayTime.value = t; a.gain.value = g; out.connect(d); d.connect(a); a.connect(master); });
  const cv = mk(ctx.createConvolver()), wet = mk(ctx.createGain()); cv.buffer = impulse(big ? 2.8 : 1.3, big ? 2.6 : 3.5); wet.gain.value = big ? .3 : .15;
  out.connect(cv); cv.connect(wet); wet.connect(master);
  return input;
}
function playVoice(buf, opts, done) {
  done = once(done); opts = opts || {};
  const src = ctx.createBufferSource(), rate = +opts.rate || 1; src.buffer = buf; src.playbackRate.value = rate;
  src.connect(paChain(opts.pa, buf.duration / rate));
  src.onended = () => { if (voiceSrc === src) voiceSrc = null; done(); };
  voiceSrc = src; src.start();
}
const proOpts = () => ({ pa: S().pa, rate: +S().depth || 1 });
const recOpts = p => ({ pa: p.echo ? (S().pa !== 'off' ? S().pa : 'field') : 'off' });

/* ---- pro announcer: AI voice made once per player, saved on the phone for offline games ---- */
const PRO_MEN = ['zeus', 'orion', 'atlas', 'apollo', 'arcas', 'aries', 'draco', 'hermes', 'hyperion', 'janus', 'jupiter', 'mars', 'neptune', 'odysseus', 'orpheus', 'pluto', 'saturn'];
const PRO_WOMEN = ['athena', 'hera', 'luna', 'thalia', 'andromeda', 'asteria', 'aurora', 'helena', 'iris', 'juno', 'minerva', 'phoebe', 'vesta'];
const EL_VOICES = [['nPczCjzI2devNBz1zQrb', 'Brian – deep, resonant'], ['pNInz6obpgDQGcFmaJgB', 'Adam – deep, American'], ['pqHfZKP75CvOlQylNhV4', 'Bill – classic broadcaster'],
  ['2EiwWnXFnvU5JabPnv8n', 'Clyde – gravelly, intense'], ['CwhRBWXzGAHq8TQ4Fs17', 'Roger – confident'], ['cjVigY5qzO86Huf0OWal', 'Eric – smooth'], ['iP95p4xoKVk53GoZ742B', 'Chris – easygoing']];
const isBasic = () => S().engine === 'basic';
const elVoice = () => (S().elCustom || '').trim() || S().elVoice || EL_VOICES[0][0];
// How the text is sent to the announcer. "Hype" adds ElevenLabs delivery tags and punches the last name.
function proText(p) {
  let t = announceText(p);
  if (isBasic() || S().style !== 'hype') return t;
  if (!(p.text && p.text.trim()) && p.name) {
    const parts = p.name.trim().split(/\s+/), last = parts.pop(), first = parts.join(' ');
    const big = last.length > 2 ? last.toUpperCase() : last;
    t = t.split(p.name).join(first ? first + '... ' + big : big);
  }
  return /^\s*\[/.test(t) ? t : '[stadium announcer, booming, excited] ' + t;
}
const proKey = p => (isBasic() ? 'basic|' + (S().speaker || 'zeus') : 'el|' + elVoice() + '|' + S().style) + '|' + proText(p);
const proReady = p => !!(p.proId && p.proKey === proKey(p));
const proMem = new Map();
function fetchPro(key, text) {
  if (!proMem.has(key)) {
    const pr = fetch((S().server || '').trim().replace(/\/$/, '') + '/api/announce', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, engine: isBasic() ? 'basic' : 'pro', voice: isBasic() ? S().speaker : elVoice(), style: S().style }) })
      .then(async r => {
        const ct = r.headers.get('content-type') || '';
        if (r.ok && ct.includes('audio')) return r.arrayBuffer();
        let m = 'Pro announcer is not reachable — open the app from its Cloudflare address';
        if (ct.includes('json')) { try { m = (await r.json()).error || m; } catch (e) {} }
        throw new Error(m);
      });
    proMem.set(key, pr); pr.catch(() => proMem.delete(key));
    while (proMem.size > 40) proMem.delete(proMem.keys().next().value);
  }
  return proMem.get(key);
}
async function ensurePro(p) { // p = the saved player
  const key = proKey(p); if (proReady(p)) return;
  const ab = await fetchPro(key, proText(p));
  if (proKey(p) !== key || proReady(p)) return;

  if (edit.p._song) blob = new Blob([edit.p._song.data], { type: edit.p._song.type });
  else if (edit.p.songId) { const r = await audioGet(edit.p.songId); if (r) blob = new Blob([r.data], { type: r.type }); }
  if (!blob || !edit) return;
  const u = URL.createObjectURL(blob); edit.urls.push(u); a.src = u;
  a.addEventListener('loadedmetadata', () => { a.currentTime = +edit?.p.start || 0; }, { once: true });
}
function markStart() { const a = $('#f-audio'); if (!a) return; $('#f-start').value = Math.round(a.currentTime * 2) / 2; a.pause(); toast('Start set to ' + fmt($('#f-start').value)); }
async function pickSong(inp) {
  const f = inp.files[0]; if (!f) return; readForm();
  const buf = await f.arrayBuffer();
  try { await decodeRaw(buf); } catch (e) { toast("That file couldn't be read as audio. Try an MP3 or M4A."); return; }
  edit.p._song = { data: buf, type: f.type || 'audio/mpeg', name: f.name.replace(/\.[^.]+$/, '') };
  edit.p.start = 0; renderEditor();
}
async function pickVoice(inp) { const f = inp.files[0]; if (!f) return; readForm(); edit.p._voice = { data: await f.arrayBuffer(), type: f.type || 'audio/mpeg', name: f.name }; renderEditor(); }
async function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Recording is not supported in this browser');
  readForm();
  try {
    setSession('play-and-record');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
    const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    const r = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [];
    r.ondataavailable = e => e.data.size && chunks.push(e.data);
    r.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); setSession('playback');
      const blob = new Blob(chunks, { type: r.mimeType || mime || 'audio/mp4' }); recorder = null;
      if (edit) { readForm(); edit.p._voice = { data: await blob.arrayBuffer(), type: blob.type, name: 'New recording' }; renderEditor(); }
    };
    recorder = r; r.start(); renderEditor();
  } catch (e) { setSession('playback'); recorder = null; toast('Microphone not available: ' + e.message); }
}
function testAnn() {
  readForm(); ac(); setSession('playback'); stopWalkup(.1);
  const p = edit.p;
  if (p.announce === 'pro') { toast('Calling the announcer…', 1200); getProBuf({ ...p, _preview: true }).then(b => playVoice(b, proOpts(), () => {})).catch(e => toast(e.message)); }
  else if (p.announce === 'voice') getVoice(p).then(b => b && playVoice(b, recOpts(p), () => {})).catch(() => toast('Could not play the recording'));
  else speak(announceText(p), () => {});
}
function previewWalkup() { readForm(); playWalkup({ ...edit.p, _preview: true }); }
async function savePlayer() {
  readForm(); const p = edit.p, t = team();
  if (!p.name) return toast('Enter the player name');
  if (recorder) recorder.stop();
  try {
    if (p._song) { const id = uid(); await audioSet(id, p._song); if (p.songId) { await audioDel(p.songId); forgetAudio(p.songId); } p.songId = id; p.songName = p._song.name; delete p._song; }
    if (p._voice) { const id = uid(); await audioSet(id, p._voice); if (p.voiceId) { await audioDel(p.voiceId); forgetAudio(p.voiceId); } p.voiceId = id; delete p._voice; }
  } catch (e) { return toast('Could not save audio: ' + e.message); }
  const i = t.players.findIndex(x => x.id === p.id);
  if (i >= 0) t.players[i] = p; else { t.players.push(p); t.lineup.push(p.id); }
  save(); closeSheet(); render(); toast('Saved ' + p.name);
  if (p.announce === 'pro' && !proReady(p)) ensurePro(p).then(render).catch(() => toast('Announcement will be made next time you have signal'));
}
async function deletePlayer() {
  const p = edit.p; if (!confirm('Delete ' + (p.name || 'this player') + '?')) return;
  const t = team(), orig = t.players.find(x => x.id === p.id);
  t.players = t.players.filter(x => x.id !== p.id); cleanLineup(t);
  if (orig) { for (const k of [orig.songId, orig.voiceId, orig.proId]) { await audioDel(k); forgetAudio(k); } }
  save(); closeSheet(); render();
}

let sx = null;
function editSfx(id) {
  const o = id && S().sfx.find(x => x.id === id);
  sx = o ? { ...o } : { id: uid(), name: '', emoji: '🔊', audioId: null, vol: 100 }; sx.isNew = !o;
  renderSfxEditor();
}
function renderSfxEditor() {
  openSheet(`<div class="sheet-head"><button onclick="closeSheet()">Cancel</button><b>${sx.isNew ? 'Add Sound' : 'Edit Sound'}</b><button class="gold" onclick="saveSfx()">Save</button></div>
    <div class="row"><label>Name<input id="s-name" value="${esc(sx.name)}" placeholder="e.g. Strikeout"></label><label class="sm">Emoji<input id="s-emo" value="${esc(sx.emoji)}" maxlength="4"></label></div>
    <h3>Audio clip</h3>
    <div class="songbox"><div class="nm">${sx._file ? esc(sx._file.name) : sx.audioId ? '✅ Clip saved' : '<span class="mut">No clip chosen</span>'}</div>

}
function readSfx() { sx.name = $('#s-name').value.trim(); sx.emoji = $('#s-emo').value.trim() || '🔊'; sx.vol = +$('#s-vol').value; }
async function pickSfx(inp) { const f = inp.files[0]; if (!f) return; readSfx(); sx._file = { data: await f.arrayBuffer(), type: f.type || 'audio/mpeg', name: f.name.replace(/\.[^.]+$/, '') }; if (!sx.name) sx.name = sx._file.name; renderSfxEditor(); }
async function saveSfx() {
  readSfx(); if (!sx.name) return toast('Give the sound a name');
  if (!sx._file && !sx.audioId) return toast('Choose an audio clip');
  if (sx._file) { const id = uid(); await audioSet(id, sx._file); if (sx.audioId) { await audioDel(sx.audioId); forgetAudio(sx.audioId); } sx.audioId = id; }
  const { isNew, _file, ...clean } = sx, list = S().sfx, i = list.findIndex(x => x.id === clean.id);
  if (i >= 0) list[i] = clean; else list.push(clean);
  save(); closeSheet(); renderSounds();
}
async function delSfx() { if (!confirm('Delete this sound?')) return; S().sfx = S().sfx.filter(x => x.id !== sx.id); await audioDel(sx.audioId); forgetAudio(sx.audioId); save(); closeSheet(); renderSounds(); }

/* ---- settings ---- */

  return `<option value="">Default voice</option>` + vs.map(v => `<option ${v.name === S().voice ? 'selected' : ''} value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');
}
function renderSettings() {
  const s = S(), t = team();
  $('#v-settings').innerHTML = `
    <div class="sec"><h3>Team</h3>
      <label>Current team<select onchange="switchTeam(this.value)">${data.teams.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)} (${x.players.length})</option>`).join('')}</select></label>
      <label>Team name<input value="${esc(t.name)}" onchange="team().name=this.value.trim()||'Team';save();render()"></label>
      <div class="tools"><button onclick="addTeam()">+ New team</button>${data.teams.length > 1 ? '<button class="danger" onclick="delTeam()">Delete team</button>' : ''}</div></div>

    <div class="sec"><h3>🎙️ Pro announcer</h3>
      <label>Announcer type<select onchange="S().engine=this.value;save();renderSettings()">

        <option value="basic" ${isBasic() ? 'selected' : ''}>Basic (included with Cloudflare)</option></select></label>
      ${isBasic() ? `<label>Voice<select onchange="S().speaker=this.value;save();renderSettings()">
        <optgroup label="Men">${PRO_MEN.map(v => `<option value="${v}" ${v === s.speaker ? 'selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`).join('')}</optgroup>
        <optgroup label="Women">${PRO_WOMEN.map(v => `<option value="${v}" ${v === s.speaker ? 'selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`).join('')}</optgroup></select></label>`
      : `<label>Voice<select onchange="S().elVoice=this.value;save();renderSettings()">${EL_VOICES.map(([id, n]) => `<option value="${id}" ${id === s.elVoice ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Delivery<select onchange="S().style=this.value;save();renderSettings()">
        <option value="hype" ${s.style === 'hype' ? 'selected' : ''}>Hype – booming stadium call</option>
        <option value="classic" ${s.style !== 'hype' ? 'selected' : ''}>Classic – smooth and steady</option></select></label>
      <label>Custom voice ID <small>(optional)</small><input value="${esc(s.elCustom)}" placeholder="Paste a voice ID from the ElevenLabs Voice Library" autocapitalize="off" autocorrect="off" onchange="S().elCustom=this.value.trim();save();renderSettings()"></label>
      <p class="hint">Want an exact stadium announcer sound? Search “stadium announcer” in the ElevenLabs Voice Library, copy the voice ID, and paste it here.</p>`}
      <label>Ballpark sound<select onchange="S().pa=this.value;save()">
        ${[['stadium', 'Big stadium P.A.'], ['field', 'Small field speakers'], ['off', 'Dry (no effect)']].map(([v, n]) => `<option value="${v}" ${v === s.pa ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Voice depth <span class="vals">${s.depth >= 1 ? 'Natural' : Math.round((1 - s.depth) * 100) + '% deeper'}</span><input type="range" min="0.85" max="1" step="0.01" value="${s.depth}" onchange="S().depth=+this.value;save();renderSettings()"></label>
      <label>What the announcer says<input value="${esc(s.template)}" onchange="S().template=this.value;save();renderSettings()"></label>
      <p class="hint">Use {number}, {name}, {first}, {position} and {team}. Use “...” for dramatic pauses. Pro voices also understand tags like [shouting] or [excited]. Example: “Now batting for the {team}... playing {position}... number {number}... {name}!”</p>
      <div class="tools"><button onclick="proSample()">▶ Hear a sample</button><button class="gold" onclick="makeAll(this)">Make all announcements</button></div>
      <p class="hint" id="proStat"></p>
      <label>Announcer server <small>(only if you open the app from GitHub Pages)</small><input value="${esc(s.server)}" placeholder="https://gsbaseballwalkout.yourname.workers.dev" onchange="S().server=this.value.trim();proMem.clear();save()" autocapitalize="off" autocorrect="off"></label></div>

    <div class="sec"><h3>📱 Phone voice <small>(backup, works with no internet)</small></h3>
      <label>Voice<select onchange="S().voice=this.value;save()">${voiceOptions()}</select></label>
      <label>Speed <span class="vals">${s.rate}</span><input type="range" min="0.5" max="1.3" step="0.05" value="${s.rate}" onchange="S().rate=+this.value;save();renderSettings()"></label>
      <label>Pitch <span class="vals">${s.pitch}</span><input type="range" min="0.5" max="1.5" step="0.05" value="${s.pitch}" onchange="S().pitch=+this.value;save();renderSettings()"></label>
      <button onclick="ac();setSession('playback');speak(announceText({name:'MJ Eubanks',number:'7',position:'shortstop'}),()=>{})">▶ Hear phone voice</button></div>

    <div class="sec"><h3>New player defaults</h3>
      <label>Play length <span class="vals">${s.length ? s.length + ' sec' : 'Whole song'}</span><input type="range" min="0" max="60" step="1" value="${s.length}" onchange="S().length=+this.value;save();renderSettings()"></label>
      <label>Fade out <span class="vals">${s.fadeOut} sec</span><input type="range" min="0" max="8" step="0.5" value="${s.fadeOut}" onchange="S().fadeOut=+this.value;save();renderSettings()"></label>
      <label>Music level under announcement <span class="vals">${Math.round(s.duck * 100)}%</span><input type="range" min="0.05" max="0.6" step="0.05" value="${s.duck}" onchange="S().duck=+this.value;save();renderSettings()"></label></div>

    <div class="sec"><h3>Backup &amp; move to another phone</h3>
      <p class="hint">Everything (songs included) lives on this device. Make a backup file to keep it safe or to load it on another phone or iPad.</p>
      <div class="tools"><button onclick="exportBackup()">⬇️ Save backup</button><label class="filebtn" style="flex:1;text-align:center;background:var(--card2);color:var(--text);font-weight:400">⬆️ Load backup<input type="file" accept=".json,application/json" onchange="importBackup(this)"></label></div>
      <p class="hint" id="store"></p></div>

    <div class="sec"><h3>Game-day tips</h3>
      <p class="hint">• Add to Home Screen (Share → Add to Home Screen) so it opens full screen and works with no signal.<br>
      • Turn your ringer/silent switch <b>off silent</b> on older iPhones, and turn the volume up.<br>
      • Pair a Bluetooth speaker before the game, then tap Preview once to make sure sound comes out of it.<br>
      • The screen stays awake while this app is open on the Game tab.</p></div>
    <p class="hint" style="text-align:center">GS Baseball Walkout Songs</p>`;
  storageInfo(); proStatus();
}
function proStatus() {
  const el = $('#proStat'); if (!el) return;
  const ps = team().players.filter(p => p.announce === 'pro'); if (!ps.length) { el.textContent = ''; return; }
  const n = ps.filter(proReady).length;
  el.textContent = n === ps.length ? `✅ All ${n} announcements saved on this phone — ready with no signal.` : `${n} of ${ps.length} announcements saved. Tap “Make all announcements” before you get to the field.`;
}
function proSample() {
  ac(); setSession('playback'); stopWalkup(.1); toast('Calling the announcer…', 1200);
  getProBuf({ id: 'sample', _preview: true, name: 'MJ Eubanks', number: '7', position: 'shortstop' }).then(b => playVoice(b, proOpts(), () => {})).catch(e => toast(e.message));
}
async function makeAll(btn) {
  const ps = team().players.filter(p => p.announce === 'pro' && !proReady(p));
  if (!ps.length) { toast('All announcements are ready'); return; }
  btn.disabled = true; let ok = 0;
  for (const p of ps) { btn.textContent = `Making ${ok + 1} of ${ps.length}…`; try { await ensurePro(p); ok++; } catch (e) { toast(e.message); break; } }
  btn.disabled = false; btn.textContent = 'Make all announcements'; proStatus();
  if (ok) toast(`Made ${ok} announcement${ok > 1 ? 's' : ''}`);
}
async function storageInfo() {
  try { const e = await navigator.storage.estimate(); const el = $('#store'); if (el) el.textContent = `Using ${(e.usage / 1048576).toFixed(1)} MB on this device.`; } catch (e) {}
}
function switchTeam(id) { stopAll(); data.teamId = id; save(); render(); }
function addTeam() { const n = prompt('Team name?'); if (!n) return; const t = newTeam(n.trim()); data.teams.push(t); data.teamId = t.id; save(); render(); }
async function delTeam() {
  const t = team(); if (!confirm(`Delete ${t.name} and all its players and songs?`)) return;
  for (const p of t.players) for (const k of [p.songId, p.voiceId, p.proId]) { await audioDel(k); forgetAudio(k); }
  data.teams = data.teams.filter(x => x.id !== t.id); data.teamId = data.teams[0].id; save(); render();
}

/* ---- backup ---- */
function abToB64(ab) { const u = new Uint8Array(ab); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToAb(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
async function exportBackup() {
  toast('Building backup…');
  try {
    const audio = {};
    for (const k of await audioKeys()) { const r = await audioGet(k); if (r) audio[k] = { type: r.type, name: r.name, b64: abToB64(r.data) }; }
    const json = JSON.stringify({ app: 'gs-walkout', v: 1, date: new Date().toISOString(), data, audio });
    const name = 'gs-walkout-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'GS Walkout backup' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  } catch (e) { toast('Backup failed: ' + e.message); }
}
async function importBackup(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'gs-walkout' || !o.data) throw new Error('Not a GS Walkout backup');
    if (!confirm('Replace everything on this device with this backup?')) return;
    stopAll(); await audioClear(); bufCache.clear(); clipCache.clear();
    for (const [k, r] of Object.entries(o.audio || {})) await audioSet(k, { type: r.type, name: r.name, data: b64ToAb(r.b64) });
    data = o.data; await kvSet('data', data); render(); toast('Backup loaded');
  } catch (e) { toast('Could not load backup: ' + e.message); }
  inp.value = '';
}

/* ---- sheet ---- */
function openSheet(html) { const s = $('#sheet'); s.innerHTML = '<div class="sheet-card">' + html + '</div>'; s.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() {
  if (recorder) { try { recorder.stop(); } catch (e) {} }
  if (edit) edit.urls.forEach(u => URL.revokeObjectURL(u));
  edit = null; sx = null;
  const s = $('#sheet'); s.classList.remove('open'); s.innerHTML = ''; document.body.style.overflow = '';
}

/* ---- keep screen awake ---- */
let wake;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {} }
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', () => { keepAwake(); }, { passive: true });

/* ============ boot ============ */
(async () => {
  setSession('playback');
  try { data = await kvGet('data'); } catch (e) {}
  if (!data || !data.teams || !data.teams.length) { data = defaultData(); save(); }
  data.settings = { ...defaultData().settings, ...data.settings };
  if (!data.settings.v2) { // switch existing players to the pro announcer
    data.teams.forEach(t => t.players.forEach(p => { if (!p.announce || p.announce === 'tts') p.announce = 'pro'; }));
    if (data.settings.template === 'Now batting, number {number}, {name}!') data.settings.template = 'Now batting... number {number}... {name}!';
    data.settings.v2 = true; save();
  }
  if (!data.settings.v3) { data.settings.engine = 'pro'; data.settings.depth = 1; data.settings.v3 = true; save(); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try { speechSynthesis.onvoiceschanged = () => view === 'settings' && renderSettings(); } catch (e) {}
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
